<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode - Hello World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 600px; }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.25rem; opacity: 0.9; margin-bottom: 2rem; }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.875rem;
        }
        .features {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .feature-title { font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Vibecodescribe!</h1>
        <p>This is a test deployment to Vercel.</p>
        <div class="badge">AgnesCode Build Challenge 2026</div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-title">Magnetic Cursor</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌙</div>
                <div class="feature-title">Dark Mode</div>
            </div>
            <div class="feature">
                <div class="feature-icon">👥</div>
                <div class="feature-title">Community</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div class="feature-title">Fast Deploy</div>
            </div>
        </div>
    </div>
</body>
</html>
