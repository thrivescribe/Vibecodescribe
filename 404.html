<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VibeCode - Redirecting...</title>
    <script type="text/javascript">
        // Handle SPA routing for GitHub Pages
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '://' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, !pathSegmentsToKeep ? 1 : pathSegmentsToKeep + 1).join('/') +
            '/index.html' + l.search + l.hash
        );
    </script>
</head>
<body>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/" />
    </noscript>
</body>
</html>
